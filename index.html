<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>FKSHJ · 游戏入口</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #06303f; color: #f7fbf3;
        font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { max-width: 560px; margin: 12vh auto; padding: 0 24px; text-align: center; }
      h1 { font-size: 1.6rem; font-weight: 700; }
      p { opacity: 0.82; line-height: 1.6; }
      a.card { display: block; margin-top: 28px; padding: 22px 20px; border-radius: 18px;
        background: rgba(7, 38, 52, 0.82); border: 1px solid rgba(255, 206, 84, 0.28);
        color: inherit; text-decoration: none; }
      a.card:hover { border-color: #ffce54; }
      .tag { color: #3be0c8; font-size: 0.85rem; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <main>
      <h1>同目录多游戏入口</h1>
      <p>每款游戏单独住在 <code>games/&lt;id&gt;/</code>，互不抢根目录。以后再开新作只需加一个子目录。</p>
      <a class="card" href="./games/sea/">
        <div class="tag">海上拾荒 · 浮岛基建</div>
        <strong>疯狂水世界</strong>
        <p>捞木板、扩建木筏、养活岛民。点这里出海。</p>
      </a>
    </main>
  </body>
</html>
